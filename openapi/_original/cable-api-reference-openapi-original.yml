openapi: 3.1.0
info:
  title: API Reference
  version: 1.0.0
paths:
  /v2/auth/token:
    post:
      operationId: request-token
      summary: Request a new access token
      description: |
        The Cable API uses API keys to authenticate requests. Make sure never to share your API keys - don’t put them in
        repositories or leave them as human-readable in code, and always use HTTPS.

        Request a new access token to authenticate requests to the API. The token will expire after the specified time.
        To request an access token you must use the refresh / auth token provided to you by Cable.
        You cannot request a new token with an existing access token.
      tags:
        - authentication
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewAccessTokenResponse'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
      requestBody:
        description: Token request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccessTokenRequest'
  /v2/transaction:
    get:
      operationId: check-transaction
      summary: Check if a transaction exists
      tags:
        - transactions
      parameters:
        - name: tx_id
          in: query
          description: The unique identifier of the transaction
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactions_checkTransaction_Response_200'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '404':
          description: Transaction does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
    post:
      operationId: add-transaction
      summary: Add a new transaction
      tags:
        - transactions
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Transaction added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteOperationResponse'
        '400':
          description: Invalid transaction data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '409':
          description: Transaction already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
      requestBody:
        description: >-
          Transaction data to add. Amount and currency are required for new transactions. At least one of sender_id or
          receiver_id must be provided with their respective country codes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTransactionRequest'
    put:
      operationId: update-transaction
      summary: Update an existing transaction
      tags:
        - transactions
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteOperationResponse'
        '400':
          description: Invalid transaction data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
      requestBody:
        description: >-
          Transaction data to update, referenced by 'tx_id'. The 'timestamp' field represents the update time. Only the
          fields to be updated need to be included.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
    delete:
      operationId: delete-transaction
      summary: Submit a deletion request for a transaction and any related data
      description: |
        This operation will submit a request to delete the transaction and any
        related data.

        The deletion request will be processed by the system and
        the data will be removed permanently from Cable's system. Deletion
        requests are not processed immediately and may take some time to
        complete.

        The status of the deletion request can be checked using the
        deletion request ID and the status endpoint.

        <Warning>This operation is not intended for regular use and should be used with caution.</Warning>
      tags:
        - transactions
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactions_deleteTransaction_Response_200'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '404':
          description: Person does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tx_id:
                  type: string
                  description: The unique identifier of the transaction
                reason:
                  type: string
                  description: The reason for deletion
              required:
                - tx_id
                - reason
