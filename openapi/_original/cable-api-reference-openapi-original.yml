          description: The unique identifier of the identity verification
        first_seen:
          type: string
          format: date-time
          description: This represents the earliest timestamp associated with the identity verification
        last_seen:
          type: string
          format: date-time
          description: This represents the latest timestamp associated with the identity verification
        organization_id:
          type: string
          description: The organization ID for which the identity verification was found
      title: Identity Verification_checkIdentityVerification_Response_200
    IdentityVerificationVerificationType:
      type: string
      enum:
        - DOCUMENT_MATCH
        - DATABASE_MATCH
        - MANUAL_VERIFICATION
      title: IdentityVerificationVerificationType
    IdentityVerificationVerifiedDataItems:
      type: object
      properties:
        type:
          type: string
          description: The type of data being verified for the person or company
        outcome:
          type: string
          description: The result of the verification for this data being verified
        value:
          type: string
          description: The actual data that was verified, such as a name or ID number.
        is_matched_externally:
          type: boolean
          description: >-
            Specifies whether the data was verified by comparing it with an external source, such as a third-party
            verification provider, external database, or through documentary verification (e.g., matching documents
            against regulatory standards).
        is_manually_verified:
          type: boolean
          description: >-
            Indicates whether the data was manually verified by an internal team or trusted individual. This is true
            when the verification process involves human intervention rather than an automated system, for example when
            verifying a document.
      required:
        - type
        - outcome
      title: IdentityVerificationVerifiedDataItems
    IdentityVerification:
      type: object
      properties:
        verification_id:
          type: string
          description: >-
            Unique identifier for an identity verification. This is the primary identifier for an identity verification
            and should be unique across all identity verifications. Updates to an identity verification should be made
            using this identifier.


            This can reference:

            - Your internal verification record ID

            - The original provider's verification ID (optionally with a prefix)

            - Any unique identifier that allows traceability to the original data source
        timestamp:
          type: string
          format: date-time
          description: >-
            When the identity verification completed, in ISO 8601 format. Use the timestamp from your verification
            provider's response.
        related_company_id:
          type: string
          description: >-
            Unique identifier of the related company entity (used for business contexts). Only one of related_company_id
            and related_person_id can be specified.
        related_person_id:
          type: string
          description: >-
            Unique identifier of the related person entity (used for retail contexts or when a person is the subject).
            Only one of related_company_id and related_person_id can be specified.
        verification_provider:
          type: string
          description: >-
            Which verification provider verified those attributes for the person or company. If this is an internal
            process, mention the name of your company.
        verification_overall_outcome:
          type: string
          description: Result of IDV screening returned from provider
        verification_type:
          $ref: '#/components/schemas/IdentityVerificationVerificationType'
        verified_data:
          type: array
          items:
            $ref: '#/components/schemas/IdentityVerificationVerifiedDataItems'
          description: >-
            Array of individual data points verified in this verification event only. Each item represents a specific
            piece of information (name, DOB, address, etc.) that was checked during this particular verification.


            Do not include:

            - Data points from other verification events

            - Aggregated results from multiple verifications

            - Data that wasn't actually verified in this specific check


            Example: If this verification only checked name and DOB, only include those two items in the array, even if
            other data points were verified in previous or separate verification events.
      required:
        - verification_id
        - timestamp
        - verification_provider
        - verified_data
      description: >-
        Request body for adding IDV (Identity Verification) information for a person or company.


        Note: Each API call represents a single verification event from one provider at a specific point in time. If you
        have multiple verification sources or multiple verification attempts, you must make separate API calls for each
        one.


        For example:

        - Document verification from Provider A requires one API call

        - Database verification from Provider B requires another API call

        - Re-verification after data update requires a new API call
      title: IdentityVerification
    NewIdentityVerificationRequest:
      type: array
      items:
        $ref: '#/components/schemas/IdentityVerification'
      title: NewIdentityVerificationRequest
    UpdateIdentityVerificationRequest:
      type: array
      items:
        $ref: '#/components/schemas/IdentityVerification'
      title: UpdateIdentityVerificationRequest
