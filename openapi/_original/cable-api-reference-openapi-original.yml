servers:
  - url: https://api.cable.tech
    description: Production
components:
  schemas:
    AccessTokenScope:
      type: object
      properties:
        organization_id:
          type: string
          description: The organization ID for which the token is requested. This is required.
        scopes:
          type: array
          items:
            type: string
          description: >-
            The list of scopes that the token should have. For transaction data, the scope should be
            'transactions:write'.
      required:
        - organization_id
        - scopes
      title: AccessTokenScope
    NewAccessTokenRequest:
      type: object
      properties:
        expiry_seconds:
          type: integer
          format: int64
          description: >-
            The requested expiration time in seconds for the token. Must be between 300 (5 minutes) and 86400 (24
            hours).
        scopes:
          $ref: '#/components/schemas/AccessTokenScope'
      required:
        - expiry_seconds
        - scopes
      title: NewAccessTokenRequest
    NewAccessTokenResponse:
      type: object
      properties:
        token:
          type: string
        expiry:
          type: integer
          format: int64
          description: The expiration time in Unix time format.
        organization_id:
          type: string
          description: The organization ID for which the token was requested.
        organization_name:
          type: string
          description: The name of the organization for which the token was requested.
        scopes:
          $ref: '#/components/schemas/AccessTokenScope'
      required:
        - token
        - expiry
        - organization_id
        - organization_name
      title: NewAccessTokenResponse
    GeneralErrorErrorsItems:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      title: GeneralErrorErrorsItems
    GeneralError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GeneralErrorErrorsItems'
          description: Detailed information about errors in specific fields.
      required:
        - code
        - message
      title: GeneralError
    Transactions_checkTransaction_Response_200:
      type: object
      properties:
        tx_id:
          type: string
          description: The unique identifier of the transaction
        first_seen:
          type: string
          format: date-time
          description: This represents the earliest timestamp associated with the transaction
        last_seen:
          type: string
          format: date-time
          description: This represents the latest timestamp associated with the transaction
        organization_id:
          type: string
          description: The organization ID for which the transaction was found
      title: Transactions_checkTransaction_Response_200
    NewTransactionRequestType:
      type: string
      enum:
        - DEPOSIT
        - WITHDRAWAL
      description: Transaction type. Required when creating new transactions, optional for updates.
      title: NewTransactionRequestType
    NewTransactionRequestMethod:
      type: string
      enum:
        - WIRE
        - ACH
        - SWIFT
        - SEPA
        - APPLE_PAY
        - GOOGLE_PAY
        - CHECK_DEPOSIT
        - INTERNAL_TRANSFER
        - RTP
        - FEDNOW
        - PROV_X_TRANSFER
        - CARD
      description: >-
        Payment method used for the transaction. Required when creating new transactions, optional for updates. Each
        method may have different processing times, fees, and regulatory requirements.
      title: NewTransactionRequestMethod
    NewTransactionRequestStatus:
      type: string
      enum:
        - CREATED
        - PENDING
        - SETTLED
        - FAILED
        - REJECTED
        - REFUNDED
      description: Transaction status. Required when creating new transactions, optional for updates.
      title: NewTransactionRequestStatus
    NewTransactionRequest:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: >-
            When the transaction was processed in your system, in ISO 8601 format. For updates, use when the event
            occurred, not when you're reporting it.
        tx_id:
          type: string
          description: >-
            Unique identifier for the transaction. This is the primary key for the transaction record and should be
            unique across all transactions. Updates to a transaction should be made using this identifier.
        is_test:
          type: boolean
          default: false
          description: If the transaction is test data, this should be set to true
        type:
          $ref: '#/components/schemas/NewTransactionRequestType'
          description: Transaction type. Required when creating new transactions, optional for updates.
        method:
          $ref: '#/components/schemas/NewTransactionRequestMethod'
          description: >-
            Payment method used for the transaction. Required when creating new transactions, optional for updates. Each
            method may have different processing times, fees, and regulatory requirements.
        amount:
          type:
            - number
            - 'null'
          format: double
          description: >-
            Transaction amount. Negative amounts are allowed for refunds, chargebacks, and credits. Zero amounts are
            allowed for auth-only, declined, and pre-authorization transactions. Required when creating new
            transactions, optional for updates.
        currency:
          type: string
          format: iso-4217
          description: ISO 4217 currency code. Required when creating new transactions, optional for updates.
        amount_usd:
          type: number
          format: double
          description: >-
            Amount in USD, if not provided will be calculated using the latest exchange rate using data from Open
            Exchange Rates (https://openexchangerates.org)
        sender_id:
          type:
            - string
            - 'null'
          description: >-
            Identifier of the sender (e.g., account number, customer ID). This ID should match the identifier used in
            your customer data sent to Cable. Required if receiver_id is not provided.
        sender_country:
          type: string
          format: iso-3166-1
          description: ISO 3166-1 alpha-2 country code of the sender. Required when sender_id is provided.
        receiver_id:
          type:
            - string
            - 'null'
          description: Identifier of the receiver (e.g., account number, customer ID). Required if sender_id is not provided.
        receiver_country:
          type: string
          format: iso-3166-1
          description: ISO 3166-1 alpha-2 country code of the receiver. Required when receiver_id is provided.
        status:
          $ref: '#/components/schemas/NewTransactionRequestStatus'
          description: Transaction status. Required when creating new transactions, optional for updates.
      required:
        - timestamp
        - tx_id
        - type
        - method
        - amount
        - currency
        - status
      description: |
        Transaction data to add. Required fields include: timestamp, tx_id, type, method, amount, currency, and status.

        Identity requirements:
        - At least one of 'sender_id' or 'receiver_id' must be provided
        - If 'sender_id' is provided, 'sender_country' is also required
        - If 'receiver_id' is provided, 'receiver_country' is also required

        Optional fields:
        - 'amount_usd': Will be automatically calculated using current exchange rates if not provided

        The 'timestamp' field represents the transaction creation time.
      title: NewTransactionRequest
    WriteOperationResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the write operation was successful.
        write_count:
          type: integer
          description: The number of records written to the database.
        message:
          type: string
          description: Provides additional information about the operation result.
        organization_id:
          type: string
          description: The organization ID for which the operation was performed.
      required:
        - success
        - write_count
        - message
        - organization_id
      title: WriteOperationResponse
