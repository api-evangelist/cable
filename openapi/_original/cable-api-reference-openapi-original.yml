              schema:
                $ref: '#/components/schemas/GeneralError'
      requestBody:
        description: >-
          An array of transaction update payloads. Each payload must include the 'tx_id' to identify the transaction and
          can include any other fields that need to be updated. The 'timestamp' field should represent the time of
          update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateTransactionRequest'
