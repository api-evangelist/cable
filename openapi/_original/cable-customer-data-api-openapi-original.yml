openapi: 3.1.0
info:
  title: Customer Data API
  version: 1.0.0
paths:
  /v1/upload/csv:
    post:
      operationId: upload-csv
      summary: CSV file upload
      tags:
        - upload
      parameters:
        - name: x-api-key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operation success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload_uploadCSV_Response_200'
      requestBody:
        description: CSV file(s) to be uploaded
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                filename:
                  type: array
                  items:
                    type: string
                    format: binary
