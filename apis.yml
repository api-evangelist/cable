aid: cable
name: Cable
description: >-
  Cable is an automated compliance and financial-crime assurance platform for banks,
  fintechs, and crypto companies. Based on transaction, customer, screening, risk-assessment,
  and onboarding data you send it, Cable continuously tests 100% of activity against your
  regulatory frameworks (US Bank Secrecy Act, UK Money Laundering Regulations, Reg E/B/Z,
  UDAAP, and others) to detect any single instance of control failure or regulatory breach,
  replacing manual dip-sampling. The Cable API is primarily a data-ingestion surface: a REST
  entry point for transferring raw data from your systems into Cable's analysis environment,
  with resource-oriented URLs, JSON request/response bodies, token-based authentication, and
  standard HTTP verbs and status codes. Cable is backed by Anthemis and CRV.
