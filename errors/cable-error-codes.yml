problems:
- status: 400
  title: Invalid data
  meaning: Request body failed validation; see errors[] for field-level detail.
  remediation: Correct the offending fields and resubmit.
- status: 401
  title: Unauthorized request
  meaning: Missing, invalid, or expired access token / API key.
  remediation: Request a fresh access token via POST /auth/token and retry.
- status: 404
  title: Resource not found
  meaning: The referenced resource (transaction, person, company, etc.) does not exist.
  remediation: Verify the id, or create the resource before referencing it.
- status: 409
  title: Resource already exists
  meaning: A resource with the same id has already been ingested.
  remediation: Use the update (PUT) operation instead of create (POST), or use the GET check endpoint first.
- status: 429
  title: Rate limit exceeded
  meaning: Too many requests in the current window.
  remediation: Back off and retry; batch endpoints reduce request volume for high-throughput ingestion.
- status: 500
  title: Server error
  meaning: Unexpected server-side failure.
  remediation: Retry with backoff; if persistent, contact Cable support (customers@cable.tech).
